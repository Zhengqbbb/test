name: review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: x-cmd-action/ai/review@main
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}

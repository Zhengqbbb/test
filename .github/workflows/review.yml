name: review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: x-cmd-action/x-cmd@v1
        with:
          stream: x7

      - name: bind Zhipu GLM
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          . ~/.x-cmd.root/X
          x agent --cfg zero_harness=claude-zhipu

      - uses: x-cmd-action/ai/review@v1
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
